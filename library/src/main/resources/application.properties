spring.application.name=library
server.port=8081

# Load .env from project root (parent of library/)
dotenv.directory=..
dotenv.filename=.env

spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Prevent DevTools from overriding datasource with in-memory H2 on hot-restart
spring.devtools.add-properties=false

# Mail Configuration
brevo.api.key=${BREVO_API_KEY}
mail.from=bcoelibrary@gmail.com