spring.application.name=library
server.port=8081

# Load .env from project root (parent of library/)
dotenv.directory=..
dotenv.filename=.env

# Local H2 Database Configuration for Development
spring.datasource.url=jdbc:h2:file:./data/librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Production PostgreSQL Configuration (Uncomment for Production)
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Render
# spring.datasource.hikari.idle-timeout=300000
# spring.datasource.hikari.max-lifetime=1800000
# spring.datasource.hikari.connection-test-query=SELECT 1

# Mail Configuration

brevo.api.key=${BREVO_API_KEY:dummy_key_for_local_dev}
mail.from=bcoelibrary@gmail.com

# Frontend URL — used in password reset emails
# On Render: set APP_FRONTEND_URL env var to your frontend URL e.g. https://bcoe-library.onrender.com
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
